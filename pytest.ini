[pytest]
# Put the project root on the import path so tests can do "from planner.models import ...".
pythonpath = .
testpaths = tests
markers =
    live: calls the real Gemini API (uses free-tier quota). Run with: pytest -m live
# Skip live tests by default. "pytest -m live" on the command line overrides this.
addopts = -m "not live"
